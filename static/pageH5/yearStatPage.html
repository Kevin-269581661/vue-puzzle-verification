<script>
  (function (doc, win, width) {
    var docEl = doc.documentElement;
    var head = doc.getElementsByTagName("head")[0];
    var hFirst = head.firstChild || head.firstElementChild;
    var cssEl = doc.createElement("style");
    //手机横屏，竖屏可在此处设置
    var resizeEvt = "orientationchange" in win ? "orientationchange" : "resize";
    var recalc = function () {
      var x;
      var n = win.devicePixelRatio || 1;
      if (n >= 4) {
        x = 4;
      } else if (n >= 3) {
        x = 3;
      } else if (n >= 2.75) {
        x = 2.75;
      } else if (n >= 2.5) {
        x = 2.5;
      } else if (n >= 2) {
        x = 2;
      } else {
        x = 1;
      }
      var clientWidth = docEl.clientWidth;
      if (!clientWidth) return;
      var pxPerRem = 100 * (clientWidth / width);
      cssEl.innerHTML = "html{ font-size:" + pxPerRem + "px!important; }";
      docEl.setAttribute("data-dpr", x);
      head.appendChild(cssEl);
    };
    recalc();
    if (!doc.addEventListener) return;
    win.addEventListener(resizeEvt, recalc, false);
    doc.addEventListener("DOMContentLoaded", recalc, false);
  })(document, window, 750);
</script>

    function switchMusic(el, status) {
