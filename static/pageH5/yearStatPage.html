<script>
  (function (doc, win, width) {
    var docEl = doc.documentElement;
    var head = doc.getElementsByTagName("head")[0];
    var hFirst = head.firstChild || head.firstElementChild;
    var cssEl = doc.createElement("style");
    //手机横屏，竖屏可在此处设置
    var resizeEvt = "orientationchange" in win ? "orientationchange" : "resize";
    var recalc = function () {
      var x;
      var n = win.devicePixelRatio || 1;
      if (n >= 4) {
        x = 4;
      } else if (n >= 3) {
        x = 3;
      } else if (n >= 2.75) {
        x = 2.75;
      } else if (n >= 2.5) {
        x = 2.5;
      } else if (n >= 2) {
        x = 2;
      } else {
        x = 1;
      }
      var clientWidth = docEl.clientWidth;
      if (!clientWidth) return;
      var pxPerRem = 100 * (clientWidth / width);
      cssEl.innerHTML = "html{ font-size:" + pxPerRem + "px!important; }";
      docEl.setAttribute("data-dpr", x);
      head.appendChild(cssEl);
    };
    recalc();
    if (!doc.addEventListener) return;
    win.addEventListener(resizeEvt, recalc, false);
    doc.addEventListener("DOMContentLoaded", recalc, false);
  })(document, window, 750);
</script>

<body>

  <script>
    var mySwiper = null
    function returnTop() {
      if (mySwiper) {
        mySwiper.slideTo(0, 1000, false); // 回跳到第一个
      }
    }
    function nextPage() {
      if (mySwiper) {
        mySwiper.slideNext();
      }
    }
    function switchMusic(el, status) {
      $(el).hide()
      if (status == 'open') {
        $('.music-img.close').show()
        $('#musicPlay')[0].pause()
      } else {
        $('.music-img.open').show()
        $('#musicPlay')[0].play()
      }
    }
    function startPlay() {
      if ($('.music-img.close').is(":visible") && $('#musicPlay')[0]) {
        $('.music-img.close').hide()
        $('.music-img.open').show()
        $('#musicPlay')[0].play()
      }
    }
    function formatTime(time) {
      let result = ['', ''];
      if (time) {
        let str = time.toString().substring(time.length - 2);
        if (str == ".0") {
          time = time.toString().substring(0, time.length - 2);
        }
        time = new Date(Date.parse(time.toString().replace(/[-\.]/g, "/")));
        let year = time.getFullYear();
        let month = time.getMonth() + 1;//js从0开始取
        let date = time.getDate();
        let hour = time.getHours();
        let minutes = time.getMinutes();
        let timeRange = '';

        if (month < 10) {
          month = "0" + month;
        }
        if (date < 10) {
          date = "0" + date;
        }
        if (hour < 6) {
          timeRange = '凌晨的';
        } else if (hour < 12) {
          timeRange = '';
        } else if (hour < 18) {
          timeRange = '下午的';
        } else if (hour < 22) {
          timeRange = '晚上的'
        } else if (hour < 24) {
          timeRange = '深夜的'
        }
        if (hour < 10) {
          hour = "0" + hour;
        }
        if (minutes < 10) {
          minutes = "0" + minutes;
        }
        result = [year + '年' + month + '月' + date + "日", hour + "时" + minutes + "分", timeRange];
      }
      return result;
    };
    function getUrlParams(name) {
      var reg = new RegExp("(^|&)" + name + "=([^&]*)(&|$)"); //构造一个含有目标参数的正则表达式对象
      var r = window.location.search.substr(1).match(reg);  //匹配目标参数
      if (r != null) return unescape(r[2]); return null; //返回参数值
    }

    $(function () {
      document.body.addEventListener("touchstart", () => {
        startPlay()
      }, { once: true });
      $('.music-img.close').show()
      $('.music-img.open').hide()
      mySwiper = new Swiper('.swiper-container', {
        direction: 'vertical', // 垂直切换选项
        autoHeight: true, //高度随内容变化
        slidesPerView: 'auto',
        observer: true,
        observeParents: true,
      })

      /* 
      testURL: "https://test-qadn.qinlindmp.com/"
      grayURL: "https://beta-qadn.qinlindmp.com/"
      prodURL: "https://www.qinlinad.com/" */
      var yearStatMdKey = getUrlParams('yearStatMdKey')
      if (!yearStatMdKey) {
        alert("链接获取失败~");
        return
      }
      $.ajax({
        type: 'GET',
        contentType: "application/json;charset=UTF-8",
        url: "https://test-qadn.qinlindmp.com/qadn-activity/yearReport/getUserYearReport?mdKey=" + yearStatMdKey,
        success: function (result) {
          console.log(result);
          if (result.SysCode == 200200) {
            var data = result.data,
              htmlStr1 = '',
              htmlStr2 = '';
            data.offWorkTime = formatTime(data.offWorkTime);
            if (data.uType == 'MD') {
              htmlStr1 = `<span class="active">${data.realName}</span>，你好
                <span class="active">${formatTime(data.registerTime)[0]}</span>
                是QADN与你结缘的第一天 
                我们共同走过了 <span class="active">${data.registerDayCnt}</span> 个日日夜夜

                过去的一年里，
                ${data.asName || ''}
                增加了 <span class="active">${data.mediaIncrCnt}</span>  个新媒体
                让客户有了更多展现品牌的机会`;
              htmlStr2 = `这一年
                你协助销售伙伴们创建了 <span class="active">${data.mdFanganCnt}</span> 个方案
                为他们打下了牢固的江山

                你预锁了 <span class="active">${data.lockFanganCnt}</span> 次点位
                让客户的订单能顺利执行

                <span class="active">${data.mdOrderCnt}</span>  个广告正因有你的发布
                才走向了千家万户

                <span class="active">${data.offWorkTime[0]}</span>  ${data.offWorkTime[2]} <span class="active">${data.offWorkTime[1]}</span>
                你还在坚持工作
                我看见你的千锤百炼，等待你的惊鸿一现`;
            } else if (data.uType == 'EP') {
              htmlStr1 = `<span class="active">${data.realName}</span>，你好
                <span class="active">${data.registerTime}</span>
                是亲邻与你结缘的第一天
                我们共同走过了 <span class="active">${data.registerDayCnt}</span> 个日日夜夜

                过去的一年里，
                <span class="active">${data.epOrderCnt}</span>   个广告
                从你的手上展开
                在人们眼中展现
                
                这一年里你点亮 <span class="active">${data.epLabCnt}</span>  盏归途的灯塔
                <span class="active">${data.epPicCnt}</span>  张照片记录下无数人归家之路`;
              htmlStr2 = `这一年
                你巡点  <span class="active">${data.epPatrolCnt}</span> 次 
                愿你踏遍山海觉得人间值得

                <span class="active">${data.epResName}</span> 是你上刊最多的小区
                
                <span class="active">${data.epMaxLabTime}</span>
                那一天，你上刊 <span class="active">${data.epMaxLabCnt}</span>  个点
                辛苦了

                <span class="active">${data.offWorkTime[0]}</span>  凌晨的 <span class="active">${data.offWorkTime[1]}</span>
                我看到你还在坚持
                星光不问赶路人，时光不负有心人`;
            } else {
              alert("权限错误~");
            }
            $('.page1-text').html(htmlStr1);
            $('.page2-text').html(htmlStr2);
          }
        },
        error: function (e) {
          console.log(e.status);
          console.log(e.responseText);
        }
      })
      // 获取微信公众号config
      console.log('-0-0', location.href.split('#')[0])
      var nonceStr, signature, timestamp, appId, shareUrl;
      $.ajax({
        //后台获取参数接口
        url: "https://uat-ashtonapi.qinlinkeji.com/platform/v1/system/getWxConfig?url=" + location.href.split('#')[0],
        /* beforeSend: function (xhr) {
          xhr.setRequestHeader("Token", getCookie("token"));
        }, */
        type: 'GET',
        success: function (data) {
          //得到参数
          let res = data.data
          console.log(res)
          var appId = res.appId;
          var nonceStr = res.nonceStr;
          var signature = res.signature;
          var timestamp = res.timestamp;
          var shareUrl = res.url;
          //通过微信config接口注入配置
          wx.config({
            debug: true, // 默认为false  为true的时候是调试模式，会打印出日志
            appId: appId,
            timestamp: timestamp,
            nonceStr: nonceStr,
            signature: signature,
            jsApiList: [
              'onMenuShareTimeline',
              'onMenuShareAppMessage'
            ]
          });
          //配置自定义分享内容
          window.share_config = {
            'share': {
              'imgUrl': 'https://deploy-1256017579.cos.ap-guangzhou.myqcloud.com/icon/wxicon/wxConfigImg.png', // 这里是需要展示的图标
              'desc': '超值礼遇。', // 这是分享展示的摘要
              'title': '合伙人现正招募中', // 这是分享展示卡片的标题
              'link': shareUrl, // 这里是分享的网址
              'success': function (rr) {
                console.log('成功' + JSON.stringify(rr))
              },
              'cancel': function (tt) {
                console.log('失败' + JSON.stringify(tt));
              }
            }
          };
          wx.ready(function () {
            wx.onMenuShareAppMessage(share_config.share);
            wx.onMenuShareTimeline(share_config.share);
          });

        },
        /* error: function (err) {

        }, */
      })
    })


  </script>
