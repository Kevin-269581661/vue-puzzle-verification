server {
    listen       80;
    server_name  localhost;
    client_max_body_size    20M;
    #if ($host != 'www.qinlinad.com' ) {
    #    rewrite ^/(.*)$ https://www.qinlinad.com/$1 permanent;
    #}
    #charset koi8-r;
    #access_log  /var/log/nginx/host.access.log  main;

    # location / {
    #     root   /usr/share/nginx/html;
    #     index  index.html index.htm;
    # }
    location / {
        add_header Cache-Control "no-cache, no-store";
        try_files $uri $uri/ @router;
        index  index.html index.htm;
        root /usr/share/nginx/html;
        #proxy_pass http://localhost:8080;
        proxy_set_header Host $host:$server_port;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Real-PORT $remote_port;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location /yearStatPage {
        add_header Cache-Control "no-cache, no-store";
        try_files $uri $uri/ @router2;
        index  yearStatPage.html yearStatPage.htm;
        root /usr/share/nginx/html/static/pageH5;
        proxy_set_header Host $host:$server_port;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Real-PORT $remote_port;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location @router{
        rewrite ^.*$ /index.html last;
    }
    location @router2{
        rewrite ^.*$ /yearStatPage.html last;
    }
    #error_page  404              /404.html;

    # redirect server error pages to the static page /50x.html
    #
    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }

    # proxy the PHP scripts to Apache listening on 127.0.0.1:80
    #
    #location ~ \.php$ {
    #    proxy_pass   http://127.0.0.1;
    #}

    # pass the PHP scripts to FastCGI server listening on 127.0.0.1:9000
    #
    #location ~ \.php$ {
    #    root           html;
    #    fastcgi_pass   127.0.0.1:9000;
    #    fastcgi_index  index.php;
    #    fastcgi_param  SCRIPT_FILENAME  /scripts$fastcgi_script_name;
    #    include        fastcgi_params;
    #}

    # deny access to .htaccess files, if Apache's document root
    # concurs with nginx's one
    #
    #location ~ /\.ht {
    #    deny  all;
    #}
}

