<script src="lib/swiper.min.js"></script>
<script src="lib/swiper.animate.min.js"></script>
<script>

    var swiper = new Swiper('.swiper-container', {
        on: {},
        // effect: 'coverflow',
        lazy: {
            loadPrevNext: true,
            loadPrevNextAmount: 2,
        },
        navigation: {
            nextEl: '.swiper-button-next',
            prevEl: '.swiper-button-prev',
        },
        // followFinger: false,
        observer: true,//修改swiper自己或子元素时，自动初始化swiper
        observeParents: true,//修改swiper的父元素时，自动初始化swiper

    });
    let btn = document.getElementById('homeBtn');
    btn.onclick = function () {
        swiper.slideTo(0, 100, false);//切换到第一个slide，速度为1秒
    };

    let li = document.getElementsByTagName('li'),
        li_len = li.length;
    for (var i = 0; i < li_len; i++) {
        li[i].index = i;
        li[i].onclick = function () {
            // console.log(this.index);
            switch (this.index) {
                case 0:
                    swiper.slideTo(1, 100, false);//切换到第2个slide，速度为1秒
                    break;
                case 1:
                    swiper.slideTo(20, 100, false)
                    break;
                case 2:
                    swiper.slideTo(4, 100, false)
                    break;
                case 3:
                    swiper.slideTo(22, 100, false)
                    break;
                case 4:
                    swiper.slideTo(7, 100, false)
                    break;
                case 5:
                    swiper.slideTo(25, 100, false)
                    break;
                case 6:
                    swiper.slideTo(11, 100, false)
                    break;
                case 7:
                    swiper.slideTo(30, 100, false)
                    break;
                case 8:
                    swiper.slideTo(13, 100, false)
                    break;
                case 9:
                    swiper.slideTo(32, 100, false)
                    break;
                case 10:
                    swiper.slideTo(15, 100, false)
                    break;
                case 11:
                    swiper.slideTo(35, 100, false)
                    break;
                case 12:
                    swiper.slideTo(18, 100, false)
                    break;
                case 13:
                    swiper.slideTo(33, 100, false)
                    break;
            }
        }
    }

    document.documentElement.addEventListener('touchstart', function (event) {
        if (event.touches.length > 1) {
            event.preventDefault();
        }
    }, false);

</script>
